services:
  - type: web
    name: quotepilot-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_INVOICER_GIVEN_NAME
        value: Maya
      - key: PAYPAL_INVOICER_SURNAME
        value: Chen
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
